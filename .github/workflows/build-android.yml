name: Build Android app

on:
  push:
    branches: ['main', 'master', 'claude/**']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write # publishes the APK as the "android-latest" release

concurrency:
  group: android-latest
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # The phone app doesn't need Electron itself.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build the app's screens
        run: npm run mobile:build

      - name: Copy them into the Android project
        run: npx cap sync android

      # Android only installs an update if it is signed with the same key as the installed app.
      # Save a key once as repository secrets ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD
      # (see README) and every build will install over the previous one. Without them, each build
      # gets a one-off key: uninstall the old app before installing a new build.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Signed with the saved key – installs as an update over the previous version." >> "$GITHUB_STEP_SUMMARY"
          else
            PASS=$(openssl rand -hex 16)
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$KS" -alias personalpacs -keyalg RSA -keysize 3072 -validity 18250 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Personal PACS" >/dev/null
            echo "ANDROID_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "Signed with a one-off key: uninstall the previous version of the app before installing this one (see README to save a key)." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "ANDROID_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist-android
          cp android/app/build/outputs/apk/release/app-release.apk "dist-android/PersonalPACS-Android-${VERSION}-build${{ github.run_number }}.apk"
          ls -la dist-android

      # A release (not a build artifact): direct .apk download on the phone, and it doesn't use
      # the account's artifact storage. Only the newest build is kept.
      - name: Publish as the "Android app – latest build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest dist-android/*.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Android app – latest build" \
            --notes "Personal PACS phone app, build ${{ github.run_number }} (commit ${GITHUB_SHA::7}). Open this page on the phone, tap the .apk to download it, then open it to install. See README › Install the phone app."
