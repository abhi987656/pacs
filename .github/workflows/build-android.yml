name: Build Android app

on:
  push:
    branches: ['main', 'master', 'claude/**']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write # publishes the APK as the "android-latest" release

concurrency:
  group: android-latest
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # The phone app doesn't need Electron itself.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle # keeps Gradle and its downloads between builds

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build the app's screens
        run: npm run mobile:build

      - name: Copy them into the Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        # Gradle downloads its tools and libraries (some from GitHub); those downloads now and then
        # fail with a 502/504, so try up to three times.
        run: |
          for i in 1 2 3; do
            ./gradlew assembleRelease --no-daemon --stacktrace && exit 0
            echo "::warning::Build attempt $i failed (often a download error) – trying again in 30 s"
            sleep 30
          done
          exit 1

      # Shows which key signed the APK (should be the permanent key from the repository).
      - name: Check the signature
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | tee signature.txt
          echo "Signed with: $(grep -m1 'SHA-256' signature.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Name the APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist-android
          cp android/app/build/outputs/apk/release/app-release.apk "dist-android/PersonalPACS-Android-${VERSION}-build${{ github.run_number }}.apk"
          ls -la dist-android

      # A release (not a build artifact): direct .apk download on the phone, and it doesn't use
      # the account's artifact storage. Only the newest build is kept.
      - name: Publish as the "Android app – latest build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest dist-android/*.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Android app – latest build" \
            --notes "Personal PACS phone app, build ${{ github.run_number }} (commit ${GITHUB_SHA::7}). Open this page on the phone, tap the .apk to download it, then open it to install. See README › Install the phone app."
