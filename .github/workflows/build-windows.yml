name: Build Windows installer

on:
  push:
    branches: ['main', 'master', 'claude/**']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write # publishes the installer as the "windows-latest" release

concurrency:
  group: windows-latest
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build installer (.exe)
        run: npm run dist:win

      # A release (not a build artifact): direct .exe downloads, and it doesn't use the account's
      # artifact storage. Only the newest build is kept.
      - name: Publish as the "Windows app – latest build" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-latest --yes --cleanup-tag || true
          gh release create windows-latest dist/*.exe \
            --prerelease --target "$GITHUB_SHA" \
            --title "Windows app – latest build" \
            --notes "Personal PACS for Windows, build ${{ github.run_number }} (commit ${GITHUB_SHA::7}). PersonalPACS-Setup-*.exe installs for your user; PersonalPACS-Portable-*.exe runs without installing."
